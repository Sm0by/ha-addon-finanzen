name: Finanzen
version: "1.2.0"
slug: finanzen
description: Depot, Fixkosten und Monatsliste – Ersatz für ein Google Sheet mit Apps Script
url: https://github.com/Sm0by/ha-addon-finanzen
arch:
  - aarch64
  - amd64
init: false
# Stop the app during backups so the SQLite database is consistent
backup: cold
ingress: true
panel_icon: mdi:finance
panel_title: Finanzen
# Notifications and the "Bezahlt" button of notifications
homeassistant_api: true
# Reading the MQTT credentials from the Supervisor
hassio_api: true
services:
  - mqtt:want
options:
  kursintervall: 15
  log_level: info
schema:
  kursintervall: int(5,120)
  log_level: list(debug|info|warning|error)
